<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Terminal window background -->
  <rect x="8" y="12" width="48" height="40" rx="6" fill="#141414" stroke="#22D3EE" stroke-width="2"/>

  <!-- Terminal header dots -->
  <circle cx="16" cy="18" r="2" fill="#F87171"/>
  <circle cx="24" cy="18" r="2" fill="#FACC15"/>
  <circle cx="32" cy="18" r="2" fill="#4ADE80"/>

  <!-- Terminal prompt line -->
  <text x="14" y="34" font-family="monospace" font-size="10" font-weight="bold" fill="#22D3EE">$</text>
  <rect x="22" y="28" width="16" height="2" rx="1" fill="#A1A1A1"/>

  <!-- Claw marks -->
  <path d="M44 38 L50 28 L48 38 Z" fill="#22D3EE"/>
  <path d="M48 38 L54 30 L52 40 Z" fill="#22D3EE"/>
  <path d="M40 40 L44 32 L44 42 Z" fill="#22D3EE" opacity="0.7"/>
</svg>
