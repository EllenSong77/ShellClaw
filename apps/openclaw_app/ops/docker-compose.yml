version: '3.9'
services:
  api:
    build:
      context: ../backend
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/openclaw_app:/tmp/openclaw_app

  worker:
    build:
      context: ../backend
    command: ["python", "worker.py"]
    env_file:
      - ../.env.example
    depends_on:
      - postgres
      - redis
    volumes:
      - /tmp/openclaw_app:/tmp/openclaw_app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openclaw_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml

  sandbox-image:
    build:
      context: ../sandbox
    image: openclaw-app-sandbox:latest
    command: ["python", "/app/runner.py"]
    profiles: ["build-only"]

volumes:
  pgdata:
